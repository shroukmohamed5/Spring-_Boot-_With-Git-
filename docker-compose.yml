services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - db
    environment:
      DB_URL: jdbc:postgresql://db:5432/taskflow
      DB_USER: taskflow
      DB_PASSWORD: taskflow
      # generate your own: openssl rand -base64 48
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your shell or .env}
    ports:
      - "8080:8080"

volumes:
  pgdata:
